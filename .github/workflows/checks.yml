name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:inbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meta-connectors-browser-check
          path: |
            test-results/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the container
        run: docker compose up --build -d
      - name: Check health, frontend and API errors
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python3 -c 'import json; h=json.load(open("/tmp/health.json")); assert h["status"] == "ok", h'
          curl --fail --silent http://127.0.0.1:8000/ | grep -q '<div id="root">'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/inbox)" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nothing-here)" = 404
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop the container
        if: always()
        run: docker compose down
