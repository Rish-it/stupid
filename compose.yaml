services:
  stupid:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    # The image's own paths and bind address win over a local .env.
    environment:
      STUPID_BIND: 0.0.0.0:8000
      STUPID_DATA_DIR: /home/nonroot/data
      STUPID_STATIC_DIR: /app/dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - stupid-data:/home/nonroot/data

volumes:
  stupid-data:
